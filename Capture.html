<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Code & Output Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-body: #faf7f2;
      --card-bg: #ffffff;
      --gold-primary: #d97706;
      --gold-dark: #b45309;
      --gold-light: #fef3c7;
      --gold-border: #f1e4c3;
      --text-main: #0f172a;
      --text-muted: #78350f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-body);
      color: var(--text-main);
      padding: 20px 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .studio-container {
      width: 100%;
      max-width: 1350px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
    }

    @media (min-width: 1024px) {
      .studio-container {
        grid-template-columns: 460px 1fr;
        align-items: start;
      }
    }

    /* Left Control Sidebar */
    .controls-panel {
      background: var(--card-bg);
      border: 1.5px solid var(--gold-border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(217, 119, 6, 0.06);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-heading {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--gold-dark);
      border-bottom: 2px solid var(--gold-light);
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input, select, textarea {
      width: 100%;
      background: #fffdfa;
      border: 1.5px solid #ebd9b0;
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
    }

    textarea {
      height: 95px;
      font-family: 'Consolas', monospace;
      font-size: 13px;
      resize: vertical;
    }

    .slider-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gold-dark);
    }

    .btn-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }

    button {
      padding: 13px 18px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    button:active { transform: scale(0.98); }

    .btn-run { background: #0f172a; color: #fff; }
    .btn-run:hover { background: #1e293b; }

    .btn-snap { background: var(--gold-primary); color: #fff; }
    .btn-snap:hover { background: var(--gold-dark); }

    .btn-clear { background: #f8fafc; color: #64748b; border: 1px solid #cbd5e1; }

    /* Right Output Section */
    .output-workspace {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .preview-card {
      background: var(--card-bg);
      border: 1.5px solid var(--gold-border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .workspace-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .workspace-head h3 {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--gold-dark);
    }

    /* THE PROFESSIONAL GOLD & WHITE EXPORT CANVAS */
    .canvas-staging-area {
      width: 100%;
      background: #f1ebd9;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: auto;
    }

    #exportFrame {
      background: linear-gradient(145deg, #fffdf8 0%, #fef3c7 45%, #fde68a 85%, #f59e0b 100%);
      padding: 45px;
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(180, 83, 9, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: padding 0.2s ease;
    }

    /* The Realistic Mac/Browser Card Window */
    .mock-window {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.18), 0 2px 10px rgba(0, 0, 0, 0.05);
      border: 1.5px solid #fef3c7;
      overflow: hidden;
      min-width: 320px;
      max-width: 600px;
      display: flex;
      flex-direction: column;
    }

    .window-header {
      background: #faf7f0;
      border-bottom: 1.5px solid #f1e6d0;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .window-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .window-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    .window-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gold-dark);
      letter-spacing: 0.02em;
    }

    /* Component Render Ground */
    .window-body {
      background: #0f172a; /* Sleek dark slate canvas inside card */
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
    }

    /* Stream of Captured Images */
    .gallery-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-download-all {
      background: #0f172a;
      color: #fff;
      padding: 10px 18px;
    }
    .btn-download-all:hover { background: #1e293b; }

    #snapshotsGrid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    @media (min-width: 600px) {
      #snapshotsGrid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }
    }

    .snapshot-item {
      background: #ffffff;
      border: 1.5px solid var(--gold-border);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .snapshot-item img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      background: #faf7f2;
      border-radius: 10px;
      border: 1px solid #ebd9b0;
    }

    .snapshot-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .snap-tag {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .btn-single-dl {
      background: var(--gold-light);
      color: var(--gold-dark);
      border: 1px solid #fde68a;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-single-dl:hover { background: #fde68a; }

    .empty-state {
      padding: 30px;
      text-align: center;
      background: #fffdfa;
      border: 1.5px dashed #ebd9b0;
      border-radius: 14px;
      color: var(--text-muted);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="studio-container">
    
    <!-- LEFT CONTROLS -->
    <div class="controls-panel">
      <div class="panel-heading">✨ Studio Configuration</div>

      <div class="form-group">
        <label>Window Title</label>
        <input type="text" id="windowTitleInput" value="Interactive Component" oninput="updateWindowTitle(this.value)">
      </div>

      <div class="form-group">
        <label>HTML</label>
        <textarea id="htmlCode"><div class="slider-box">
  <div class="slide-item active" style="background:#ef4444;">1. Red View</div>
  <div class="slide-item" style="background:#2563eb;">2. Blue View</div>
  <div class="slide-item" style="background:#10b981;">3. Green View</div>
</div>
<div class="controls">
  <button onclick="prevSlide()">Prev</button>
  <button onclick="nextSlide()">Next</button>
</div></textarea>
      </div>

      <div class="form-group">
        <label>CSS</label>
        <textarea id="cssCode">.slider-box { width: 260px; height: 130px; position: relative; border-radius: 12px; overflow: hidden; border: 2px solid #38bdf8; box-shadow: 0 0 15px rgba(56,189,248,0.3); }
.slide-item { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; color: #fff; font-size: 1rem; font-weight: bold; }
.slide-item.active { display: flex; }
.controls { margin-top: 12px; display: flex; gap: 8px; justify-content: center; }
.controls button { padding: 6px 14px; background: #38bdf8; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #0f172a; }</textarea>
      </div>

      <div class="form-group">
        <label>JavaScript</label>
        <textarea id="jsCode">let currentSlide = 0;

window.nextSlide = function() {
  const slides = document.querySelectorAll('#pureOutputTarget .slide-item');
  if(!slides.length) return;
  slides[currentSlide].classList.remove('active');
  currentSlide = (currentSlide + 1) % slides.length;
  slides[currentSlide].classList.add('active');
};

window.prevSlide = function() {
  const slides = document.querySelectorAll('#pureOutputTarget .slide-item');
  if(!slides.length) return;
  slides[currentSlide].classList.remove('active');
  currentSlide = (currentSlide - 1 + slides.length) % slides.length;
  slides[currentSlide].classList.add('active');
};</textarea>
      </div>

      <div class="form-group">
        <div class="slider-box">
          <label>Outer Safety Padding</label>
          <span id="padLabel">45px</span>
        </div>
        <input type="range" id="padSlider" min="25" max="80" value="45" oninput="updateFramePadding(this.value)">
      </div>

      <div class="btn-grid">
        <button class="btn-run" onclick="mountProject()">Apply Code</button>
        <button class="btn-snap" onclick="captureLiveSnapshot()">📸 Capture Current State</button>
        <button class="btn-clear" onclick="clearAllSnapshots()">Clear Gallery</button>
      </div>
    </div>

    <!-- RIGHT STAGE -->
    <div class="output-workspace">
      
      <div class="preview-card">
        <div class="workspace-head">
          <h3>Live Interactive Presentation Frame</h3>
          <span style="font-size:0.8rem; font-weight:700; color:var(--gold-dark); background:var(--gold-light); padding:4px 10px; border-radius:20px;">Gold & White Pro Theme</span>
        </div>

        <div class="canvas-staging-area">
          <!-- THIS FRAME IS CAPTURED AS PROFESSIONAL IMAGE -->
          <div id="exportFrame">
            <div class="mock-window">
              <div class="window-header">
                <div class="window-dots">
                  <div class="window-dot" style="background:#ef4444;"></div>
                  <div class="window-dot" style="background:#f59e0b;"></div>
                  <div class="window-dot" style="background:#10b981;"></div>
                </div>
                <div class="window-title" id="displayedTitle">Interactive Component</div>
                <div style="width:30px;"></div>
              </div>
              <div class="window-body">
                <div id="pureOutputTarget"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- GALLERY SECTION -->
      <div class="gallery-head">
        <h3 style="font-size:1.1rem; font-weight:800; color:var(--gold-dark);">Captured Snapshots Gallery</h3>
        <button class="btn-download-all" onclick="downloadAllSnapshots()">Download All Snapshots</button>
      </div>

      <div id="snapshotsGrid">
        <div class="empty-state" id="emptyMsg">Abhi koi snapshot capture nahi hua hai. Interactive window me slide change karein aur "Capture Current State" dabayein!</div>
      </div>

    </div>

  </div>

  <script>
    let capturedList = [];
    let stateIdx = 0;

    function updateWindowTitle(text) {
      document.getElementById('displayedTitle').innerText = text.trim() || 'Interactive Component';
    }

    function updateFramePadding(val) {
      document.getElementById('padLabel').innerText = `${val}px`;
      document.getElementById('exportFrame').style.padding = `${val}px`;
    }

    function mountProject() {
      const target = document.getElementById('pureOutputTarget');
      const html = document.getElementById('htmlCode').value;
      const css = document.getElementById('cssCode').value;
      const js = document.getElementById('jsCode').value;

      target.innerHTML = '';
      const oldStyle = document.getElementById('runtime-style');
      if (oldStyle) oldStyle.remove();

      const style = document.createElement('style');
      style.id = 'runtime-style';
      style.innerHTML = css;
      document.head.appendChild(style);

      target.innerHTML = html;

      try {
        const runFn = new Function(js);
        runFn();
      } catch (err) {
        console.error('JS Syntax/Runtime Error:', err);
      }
    }

    async function captureLiveSnapshot() {
      const exportFrame = document.getElementById('exportFrame');

      try {
        const canvas = await html2canvas(exportFrame, {
          backgroundColor: null,
          scale: 2, // Crisp 2x Ultra HD
          useCORS: true,
          logging: false
        });

        stateIdx++;
        const titleText = document.getElementById('windowTitleInput').value.trim() || 'Component';
        const dataUrl = canvas.toDataURL('image/png', 1.0);

        capturedList.push({
          id: Date.now(),
          title: `${titleText} - State ${stateIdx}`,
          data: dataUrl
        });

        renderGallery();
      } catch (e) {
        console.error('Capture error:', e);
      }
    }

    function renderGallery() {
      const grid = document.getElementById('snapshotsGrid');
      grid.innerHTML = '';

      if (capturedList.length === 0) {
        grid.innerHTML = '<div class="empty-state">Abhi koi snapshot capture nahi hua hai. Interactive window me slide change karein aur "Capture Current State" dabayein!</div>';
        return;
      }

      capturedList.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'snapshot-item';

        const img = document.createElement('img');
        img.src = item.data;
        img.alt = item.title;

        const footer = document.createElement('div');
        footer.className = 'snapshot-footer';

        const tag = document.createElement('span');
        tag.className = 'snap-tag';
        tag.innerText = item.title;

        const dlBtn = document.createElement('button');
        dlBtn.className = 'btn-single-dl';
        dlBtn.innerText = 'Download PNG';
        dlBtn.onclick = () => downloadImage(item.data, `${item.title.toLowerCase().replace(/[^a-z0-9]/gi, '_')}.png`);

        footer.appendChild(tag);
        footer.appendChild(dlBtn);

        card.appendChild(img);
        card.appendChild(footer);
        grid.appendChild(card);
      });
    }

    function clearAllSnapshots() {
      capturedList = [];
      stateIdx = 0;
      renderGallery();
    }

    function downloadImage(dataUrl, filename) {
      const link = document.createElement('a');
      link.download = filename;
      link.href = dataUrl;
      link.click();
    }

    function downloadAllSnapshots() {
      if (capturedList.length === 0) {
        alert('Pehle states capture karein!');
        return;
      }

      capturedList.forEach((step, idx) => {
        setTimeout(() => {
          downloadImage(step.data, `${step.title.toLowerCase().replace(/[^a-z0-9]/gi, '_')}.png`);
        }, idx * 250);
      });
    }

    window.onload = () => {
      mountProject();
      updateFramePadding(45);
    };
  </script>
</body>
</html>
